  <text x="84" y="312" fill="white" font-family="Arial, PingFang SC, sans-serif" font-size="78" font-weight="700">心智悦动</text>
  <text x="84" y="395" fill="#d8ecff" font-family="Arial, PingFang SC, sans-serif" font-size="34">企业 AI 转型与 AI 原生创业加速平台</text>
  <rect x="84" y="482" width="250" height="64" rx="32" fill="white"/>
  <text x="209" y="524" fill="#174b82" text-anchor="middle" font-family="Arial, PingFang SC, sans-serif" font-size="23" font-weight="700">查看网站</text>

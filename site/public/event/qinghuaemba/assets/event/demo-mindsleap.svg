  <desc id="desc">深蓝色企业 AI 转型主题封面</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2347"/>
      <stop offset="1" stop-color="#2e73b9"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="24%" r="60%">
      <stop offset="0" stop-color="#8ed3ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#8ed3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="750" fill="url(#bg)"/>

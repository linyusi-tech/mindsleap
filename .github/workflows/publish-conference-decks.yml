name: Publish Conference Decks
on:
  push:
    branches: [content/conference-decks-20261107]
    paths:
      - 'site/public/decks/index.html'
      - 'site/public/decks/Conference/**'
      - '.github/workflows/publish-conference-decks.yml'
concurrency:
  group: deploy-mindsleap-cn
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Publish Conference category and collection
        env:
          SSH_HOST: ${{ secrets.CN_SERVER_HOST }}
          SSH_PORT: ${{ secrets.CN_SERVER_PORT }}
          SSH_USER: ${{ secrets.CN_SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CN_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          check_snapshot() {
            local relative="$1" expected="$2" current updated
            current="$(ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "sha256sum /www/wwwroot/mindsleap/$relative" | cut -d' ' -f1)"
            updated="$(sha256sum "$relative" | cut -d' ' -f1)"
            if [ "$current" != "$expected" ] && [ "$current" != "$updated" ]; then
              echo "The live $relative changed since capture; reconcile before publishing." >&2
              exit 1
            fi
          }
          check_snapshot site/public/decks/index.html 64bc3263111ab789af708e421cb04183146359a9fbd17fd57014ad3e7d99052c
          check_snapshot site/public/decks/Conference/index.html 1ce9396718135816880c629f21e7d558832fc6f013f76d7d3bf09bb8b4a0b303
          check_snapshot site/public/decks/Conference/2026november8/index.html 92e31564118cb1c45ad3ceedb44353d59b381a691e6a474c89240657fe6f5264
          rsync -azcR --timeout=90 --info=progress2 -e "ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p $SSH_PORT" \
            ./site/public/decks/Conference/2026november8/assets/ \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/mindsleap/"
          rsync -azcR --timeout=90 --info=progress2 -e "ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p $SSH_PORT" \
            ./site/public/decks/index.html \
            ./site/public/decks/Conference/index.html \
            ./site/public/decks/Conference/2026november8/index.html \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/mindsleap/"
          ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" 'pm2 restart mindsleap-main --update-env'
      - name: Verify category and collection
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            if curl -fsSL https://www.mindsleap.cn/decks | grep -q 'Conference Decks' \
              && curl -fsSL https://www.mindsleap.cn/decks/Conference/index.html | grep -q '2026november8/index.html' \
              && curl -fsSL https://www.mindsleap.cn/decks/Conference/2026november8/index.html -o /tmp/conference.html \
              && cmp /tmp/conference.html site/public/decks/Conference/2026november8/index.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1

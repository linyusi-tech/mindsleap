name: Publish Enterprise AI practice product
on:
  push:
    branches: [content/enterprise-ai-launch-product-20261112]
    paths:
      - 'site/public/product/index.html'
      - 'site/public/product/enterprise-ai-practice-launch/**'
      - 'scripts/practice-*'
      - '.github/workflows/publish-practice-product.yml'
concurrency:
  group: deploy-mindsleap-cn
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Back up and publish only Enterprise AI practice report and Product directory
        env:
          SSH_HOST: ${{ secrets.CN_SERVER_HOST }}
          SSH_PORT: ${{ secrets.CN_SERVER_PORT }}
          SSH_USER: ${{ secrets.CN_SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.CN_SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts
          ssh_options=(-o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p "$SSH_PORT")
          check_current() {
            local current updated
            current="$(ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" 'sha256sum /www/wwwroot/mindsleap/site/public/product/index.html' | cut -d' ' -f1)"
            updated="$(sha256sum site/public/product/index.html | cut -d' ' -f1)"
            if [ "$current" != f9fa2097b89c183bbfc90b8de429ee5078e19731cd3567a22ff78deb3a8e4303 ] && [ "$current" != "$updated" ]; then
              echo 'Product directory changed since capture. Reconcile before publishing.' >&2
              exit 1
            fi
          }
          check_current
          report_expected="$(sha256sum site/public/product/enterprise-ai-practice-launch/index.html | cut -d' ' -f1)"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "bash -s -- $GITHUB_SHA $report_expected" <<'PRACTICE_BACKUP'
          set -euo pipefail
          root=/www/wwwroot/mindsleap/site/public/product
          if [ -f "$root/enterprise-ai-practice-launch/index.html" ]; then
            actual="$(sha256sum "$root/enterprise-ai-practice-launch/index.html" | cut -d' ' -f1)"
            [ "$actual" = "$2" ] || { echo 'Existing report differs from this release.' >&2; exit 1; }
          fi
          backup="/www/wwwroot/mindsleap-backups/practice-$1"
          mkdir -p "$backup"
          [ -f "$backup/product-index.html" ] || cp -p "$root/index.html" "$backup/product-index.html"
          PRACTICE_BACKUP
          rsync -azcR --timeout=90 --info=progress2 --files-from=scripts/practice-release-files.txt \
            -e "ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p $SSH_PORT" \
            ./ "$SSH_USER@$SSH_HOST:/www/wwwroot/mindsleap/"
          check_current
          rsync -azc --timeout=90 \
            -e "ssh -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -p $SSH_PORT" \
            site/public/product/index.html \
            "$SSH_USER@$SSH_HOST:/www/wwwroot/mindsleap/site/public/product/index.next-$GITHUB_SHA.html"
          ssh "${ssh_options[@]}" "$SSH_USER@$SSH_HOST" "mv /www/wwwroot/mindsleap/site/public/product/index.next-$GITHUB_SHA.html /www/wwwroot/mindsleap/site/public/product/index.html && pm2 restart mindsleap-main --update-env"
      - name: Verify Product entry and report
        run: |
          set -euo pipefail
          for attempt in $(seq 1 10); do
            if curl -fsSL --connect-timeout 10 --max-time 30 https://www.mindsleap.cn/product -o /tmp/product.html \
              && cmp /tmp/product.html site/public/product/index.html \
              && curl -fsSL --connect-timeout 10 --max-time 30 https://www.mindsleap.cn/product/enterprise-ai-practice-launch/index.html -o /tmp/practice.html \
              && cmp /tmp/practice.html site/public/product/enterprise-ai-practice-launch/index.html; then
              exit 0
            fi
            sleep 5
          done
          exit 1
